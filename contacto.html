<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de contacto de la web personal de Pedro.">
  <meta name="author" content="Pedro">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <title>Contacto - Mi web personal</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="inicio">
    <h1>Contacto</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="aficiones.html">Aficiones</a>
      <a href="estudios.html">Estudios</a>
      <a href="contacto.html" aria-current="page">Contacto</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Escríbeme</h2>
      <form action="#" method="post">
        <p>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </p>
        <p>
          <label for="correo">Correo:</label>
          <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
        </p>
        <p>
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" minlength="6">
        </p>
        <p>
          <label for="edad">Edad:</label>
          <input type="number" id="edad" name="edad" min="0" max="120">
        </p>

        <fieldset>
          <legend>Turno</legend>
          <input type="radio" id="manana" name="turno" value="manana">
          <label for="manana">Mañana</label>
          <input type="radio" id="tarde" name="turno" value="tarde">
          <label for="tarde">Tarde</label>
        </fieldset>

        <fieldset>
          <legend>Aficiones</legend>
          <input type="checkbox" id="musica" name="aficiones" value="musica">
          <label for="musica">Música</label>
          <input type="checkbox" id="deporte" name="aficiones" value="deporte">
          <label for="deporte">Deporte</label>
          <input type="checkbox" id="videojuegos" name="aficiones" value="videojuegos">
          <label for="videojuegos">Videojuegos</label>
        </fieldset>

        <p>
          <label for="provincia">Provincia:</label>
          <select id="provincia" name="provincia">
            <option value="valencia">Valencia</option>
            <option value="alicante">Alicante</option>
            <option value="castellon">Castellón</option>
          </select>
        </p>
        <p>
          <label for="valoracion">Valora mi web (1-10):</label>
          <input type="range" id="valoracion" name="valoracion" min="1" max="10" value="5">
        </p>
        <p>
          <label for="color">Tu color favorito:</label>
          <input type="color" id="color" name="color" value="#2b6cb0">
        </p>
        <p>
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="5" cols="40" placeholder="Escribe aquí tu mensaje"></textarea>
        </p>
        <p>
          <input type="checkbox" id="acepto" name="acepto" required>
          <label for="acepto">Acepto que me respondan por correo</label>
        </p>
        <button type="submit">Enviar</button>
      </form>
    </section>

    <section>
      <h2>Dónde estoy</h2>
      <iframe title="Mapa de Denia" width="400" height="250"
        src="https://www.openstreetmap.org/export/embed.html?bbox=-0.43%2C39.44%2C-0.32%2C39.50&amp;layer=mapnik"></iframe>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Pedro - Mi web personal</p>
    <address>¿Dudas? <a href="contacto.html">Escríbeme</a></address>
    <p><a href="#inicio">⬆ Volver arriba</a></p>
  </footer>
</body>
</html>
